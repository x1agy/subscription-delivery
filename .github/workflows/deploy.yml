name: Deploy subscription

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Generate subscription
        env:
          CONFIG: ${{ secrets.CONFIG }}
          TOKEN: ${{ secrets.SUBSCRIPTION_TOKEN }}
        run: |
          mkdir -p dist
          printf '%s\n' "$CONFIG" > "dist/$TOKEN.txt"
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
